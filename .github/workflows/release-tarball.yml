name: Create Release Tarball

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install GitHub CLI
      run: sudo apt-get update && sudo apt-get install -y gh

    - name: Create tarballs for each theme directory
      run: |
        for d in */ ; do
          dir=${d%/}
          tar -czf "$dir.tar.gz" "$dir"
        done

    - name: Upload tarballs as artifacts (for main branch pushes)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: theme-tarballs
        path: "*.tar.gz"

    - name: Create or update GitHub Release for main
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view latest || gh release create latest --title "latest" --notes "Latest main branch tarballs"
        gh release upload latest *.tar.gz --clobber

    - name: Create or update GitHub Release for tags
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="${GITHUB_REF#refs/tags/}"
        gh release view "$tag" || gh release create "$tag" --title "$tag" --notes "Release $tag"
        gh release upload "$tag" *.tar.gz --clobber
